<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/documentos.css">
    <title>Nuevo Documento</title>
    <style>
        body {
            display: none;
        }
    </style>
</head>

<body data-login="login.html">

    <header class="header">

        <a href="https://www.hc.edu.uy/" target="_blank" class="logo">
            <img src="../assets/img/Logo_Hc.png" alt="Hospital de Clínicas">
        </a>

        <a class="btn" href="documentosAdmin.html">
            Volver
        </a>

    </header>

<main class="dashboard">

    <h1>Nuevo Documento</h1>

    <form id="formDocumento" class="formulario-documento" enctype="multipart/form-data">

        <label for="titulo">Título</label>
        <input
            type="text"
            id="titulo"
            name="titulo"
            placeholder="Ej: Cuidados Postoperatorios"
            required
        >

        <label for="descripcion">Descripción</label>
        <textarea
            id="descripcion"
            name="descripcion"
            placeholder="Escriba una breve descripción del documento"
        ></textarea>

        <label for="categoria">Categoría</label>
        <select id="categoria" name="categoria_id" required>
            <option value="">Seleccione una categoría</option>
        </select>

        <label for="archivo">Documento PDF</label>
        <input
            type="file"
            id="archivo"
            name="archivo"
            accept=".pdf"
            required
        >

        <label for="imagen">Imagen de portada</label>

        <input
             type="file"
             id="imagen"
             name="imagen"
             accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
>

        <label class="check-publicar">
            <input
                type="checkbox"
                name="activo"
                value="1"
                checked
            >
            Publicar documento
        </label>

        <p id="mensaje"></p>

        <div class="acciones-formulario">

            <a class="btn" href="documentosAdmin.html">
                Cancelar
            </a>

            <button type="submit" class="btn">
                Guardar Documento
            </button>

        </div>

    </form>

</main>
    <script src="../assets/js/protegerSesion.js"></script>
    <script src="../assets/js/nuevoDocumento.js"></script>

</body>

</html>
