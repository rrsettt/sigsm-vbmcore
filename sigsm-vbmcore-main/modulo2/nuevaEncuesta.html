<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/documentos.css">
    <title>Nueva Encuesta</title>
</head>

<body data-login="login.html">

<header class="header">
    <div class="logo">
        <img src="../assets/img/Logo_Hc.png" alt="Hospital de Clínicas">
    </div>

    <a href="encuestasAdmin.html" class="btn">
        Volver
    </a>
</header>

<main class="dashboard">

    <h1>Nueva Encuesta</h1>

    <form id="formEncuesta" class="formulario-documento">

        <label for="titulo">Título</label>
        <input type="text" id="titulo" required>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion"></textarea>

        <label>
            <input type="checkbox" id="activa" checked>
            Publicar encuesta
        </label>

        <h3>Preguntas</h3>

        <div id="preguntas">
            <input
                type="text"
                class="pregunta"
                placeholder="Pregunta 1"
                required
            >
        </div>

        <button type="button" id="agregarPregunta" class="btn">
            Agregar pregunta
        </button>

        <p id="mensaje"></p>

        <button type="submit" class="btn">
            Guardar encuesta
        </button>

    </form>

</main>
<script src="../assets/js/protegerSesion.js"></script>
<script src="../assets/js/nuevaEncuesta.js"></script>
</body>
</html>
