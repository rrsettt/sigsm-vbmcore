<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="../assets/css/login.css?v=10">
        <title>Acceso al personal</title>
    </head>
    <body>
        <header class="encabezado">
            <div class="logo">
                <a href="../index.html">
                    <img src="../assets/img/Logo_Hc.png" alt="Logo Hospital de Clínicas">
                </a>
            </div>
            <a class="btn btn-secundario" href="../index.html">Volver al portal</a>
        </header>
        <main class="contenedor-simple">
            <section class="login-card">
                <div class="login-formulario">
                    <h1>Acceso al personal</h1>
                    <p>Ingrese con su cuenta. Los funcionarios acceden a la administración y los médicos a la revisión de documentos.</p>
                    <form id="formularioLogin">
                        <label for="usuario">Usuario</label>
                        <input
                type="text"
                id="usuario" autocomplete="username"
                name="usuario"
                class="campo"
                placeholder="Ingrese su usuario"
                required
            >
                        <label for="password">Contraseña</label>
                        <input
                type="password"
                id="password" autocomplete="current-password"
                name="password"
                class="campo"
                placeholder="Ingrese su contraseña"
                required
            >
                        <p id="mensaje" class="mensaje" role="status"></p>
                        <button type="submit" class="boton">
                Ingresar
            </button>
                    </form>
                </div>
                <div class="login-imagen">
                    <img src="../assets/img/Clinicas.png" alt="Hospital de Clínicas">
                    <div class="login-presentacion">
                        <h2>Hospital de Clínicas</h2>
                        <p>Gestión documental y coordinación de traslados.</p>
                    </div>
                </div>
            </section>
        </main>
        <footer class="pie-login"><span>Hospital de Clínicas · Acceso al personal</span><span>Proyecto <strong>VBMCore</strong></span></footer>
        <script src="../assets/js/login.js?v=12"></script>
    </body>
</html>
